<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hello World!</title>

    <!--Responsive viewport-->
    <meta name="viewport" content="width= device-width, initial-scale= 1.0">

    <style>
        /* Global reset for predictable sizing */
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: blueviolet;
            font-family: Verdana, sans-serif;
            margin: 0;
            padding: 1rem;
            color: white; /* improves contrast on purple background */
        }

        a.skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 8px;
        }

        a.skip-link:focus {
            top: 0;
        }

        header, main {
            display: block;
            max-width: 800px;  /* keeps content readable on large screens */
            margin: 0 auto;    /* centres content */
            padding: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
        }

        h2 {
            font-size: 1.5rem;
            text-align: center;
        }

        p {
            text-align: center;
            padding: 0 1rem;
        }

        img {
            max-width: 100%;  /* responsive image */
            height: auto;
            display: block;
            margin: 1rem auto;

        }

        a {
            color: #ffff66; /* high contrast yellow link */
        }

        /* MEDIA QUERIES FOR RESPONSIVE DESIGN */

        /* Tablet layout (601px-900px) */
        @media only screen and (min-width: 601px) and (max-width: 900px) {
            h1 { 
                font-size: 2.3rem;
            }
            h2 {
                font-size: 1,4 rem;
            }
            body {
                padding: 2rem;
            }
        }

        /* Desktop layout (900px+) */
        @media only screen and (min-width: 901px) {
            h1 {
                font-size: 2.5 rem;
            }
            h2 {
                font-size: 1.6 rem;
            }
            main {
                padding: 2rem;
            }
        }


    </style>
</head>

<body>

    <a href="#main" class="skip-link">Skip to main content</a>

    <header>
        <h1>Enhancing Web App</h1>
        <h2><b>Using attributes, links, images, headings, and paragraphs</b></h2>
    </header>

    <main id="main">
        <p>
            I enjoyed learning about HTML basics this week.<br>
            <i>I look forward to improving my knowledge throughout the rest of this module.</i>
        </p>

        <img src="https://www.w3schools.com/images/w3schools_green.jpg"
             alt="W3Schools Logo"
             width="104" height="142">

        <p>
            <a href="https://www.w3schools.com">Learn more at W3Schools</a>
        </p>
    </main>

</body>
</html>
